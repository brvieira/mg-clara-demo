services:
  workshop-mcp:
    build:
      context: ./workshop-mcp
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8000"

  policy-mcp:
    build:
      context: ./policy-mcp
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8001"

  customer-api:
    build:
      context: ./customer-api
    ports:
      - "8090:8090"
    env_file:
      - .env

  ai-agent:
    build:
      context: ./ai-agent
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # Dentro da rede do compose os servidores MCP são alcançados pelo nome do
      # serviço, não por localhost (default usado fora do Docker, ver .env.example).
      WORKSHOP_MCP_URL: "http://workshop-mcp:8000/mcp"
      POLICY_MCP_URL: "http://policy-mcp:8001/mcp"
    depends_on:
      - workshop-mcp
      - policy-mcp

  webapp:
    build:
      context: ./webapp
      args:
        # URLs baked into the JS bundle at build time -- resolved by the
        # browser, so they must be the host-published ports, not in-network
        # service names (see webapp/.env.example).
        VITE_API_BASE_URL: "http://localhost:8080"
        VITE_CUSTOMER_API_BASE_URL: "http://localhost:8090"
    ports:
      - "5173:80"
    depends_on:
      - ai-agent
      - customer-api
